<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Farlandic Dictionary Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dictionary">

    <a href="index.html" class="nav-button">⌂</a>

    <h1>Farlandic Dictionary</h1>

    <div class="search-menu">

        <button id="search-toggle" class="dictionary-button" onclick="toggleSearch()">
            ⌕ Search
        </button>

        <div id="search-box" class="search-box">

            <input
                id="search"
                type="text"
                placeholder="Search Farlandic or English"
                oninput="searchWords()">

        </div>

    </div>

    <div id="dictionary-links" class="dictionary-links">

        <a href="dictionary.html" class="dictionary-button">
            Noun Dictionary
        </a>

        <a href="verbuary.html" class="dictionary-button">
            Verb Dictionary
        </a>

        <a href="pronoun.html" class="dictionary-button">
            Pronoun Dictionary
        </a>

        <a href="adjective.html" class="dictionary-button">
            Adjective Dictionary
        </a>

    </div>

    <div id="results"></div>

</div>

<script src="wordlist.js"></script>
<script src="search.js"></script>

</body>
</html>
